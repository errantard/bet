<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로토 승부식 135회차</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --accent-gold: #ffd700;
      --border-color: #333333;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .sync-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .top-section {
      padding: 16px;
      background: #181818;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .combo-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .combo-card:active {
      transform: scale(0.98);
    }

    .combo-card.hit {
      border-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
    }
    
    .combo-card.fail {
      opacity: 0.6;
    }
    
    .combo-card.fail .combo-title {
      text-decoration: line-through;
      color: var(--accent-red);
    }

    .card-fill-gauge {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 100%;
      background: rgba(0, 255, 136, 0.15);
      width: 0%;
      transition: width 0.4s ease-out;
      z-index: 1;
    }

    .combo-content {
      position: relative;
      z-index: 2;
    }

    .combo-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .combo-stats {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .combo-stats .highlight {
      color: var(--accent-gold);
      font-weight: 600;
    }

    .match-point-pulse {
      animation: heartbeat 1.5s infinite;
      color: var(--accent-gold);
      font-weight: bold;
      font-size: 0.8rem;
      margin-top: 4px;
      display: inline-block;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); text-shadow: 0 0 4px rgba(255,215,0,0.4); }
      14% { transform: scale(1.1); text-shadow: 0 0 10px rgba(255,215,0,0.8); }
      28% { transform: scale(1); text-shadow: 0 0 4px rgba(255,215,0,0.4); }
      42% { transform: scale(1.1); text-shadow: 0 0 10px rgba(255,215,0,0.8); }
      70% { transform: scale(1); text-shadow: 0 0 4px rgba(255,215,0,0.4); }
    }

    .scrollable-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-dark);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .match-item.hit {
      border-left: 4px solid var(--accent-green);
    }
    .match-item.fail {
      border-left: 4px solid var(--accent-red);
      opacity: 0.7;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .match-teams {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      margin: 4px 0;
    }

    .match-pick {
      display: flex;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .pick-val {
      font-weight: bold;
      color: var(--accent-gold);
    }

    .match-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      background: #333;
      border-radius: 4px;
      color: #ddd;
    }

    /* 슬라이드 서랍 */
    .combo-drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .combo-drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      padding: 16px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-title {
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      display: none;
    }
    
    .drawer-badge.fail-badge {
      background: var(--accent-red);
      color: #fff;
    }

    .drawer-close {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .drawer-money-box {
      padding: 16px;
      background: #1a1a1a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .money-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .money-item.highlight {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    .drawer-match-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .status-hit { background: rgba(0,255,136,0.2); color: var(--accent-green); }
    .status-fail { background: rgba(255,51,102,0.2); color: var(--accent-red); }
    .status-wait { background: rgba(255,255,255,0.1); color: #ccc; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">프로토 승부식 <span id="roundNum">135</span>회차</div>
    <div class="sync-status">
      <span id="syncText">연결중...</span>
      <div class="sync-dot" id="syncDot"></div>
    </div>
  </header>

  <div class="top-section">
    <div class="cards-grid" id="cardsGrid"></div>
    
    <!-- 서랍 -->
    <div id="comboDetailDrawer" class="combo-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <span id="drawerTitle">조합</span>
          <span class="drawer-badge" id="drawerBadge"></span>
        </div>
        <button class="drawer-close" onclick="closeDrawer()" title="닫기">✕</button>
      </div>
      <div class="drawer-money-box">
        <div class="money-item">
          <span class="money-lbl">배팅 금액</span>
          <span class="money-val" id="drawerBetAmount">0원</span>
        </div>
        <div class="money-item highlight" id="drawerPayoutBox">
          <span class="money-lbl" id="drawerPayoutLbl">적중 예상금</span>
          <span class="money-val" id="drawerPayout">0원</span>
        </div>
      </div>
      <div class="drawer-match-list" id="drawerMatchList"></div>
    </div>
  </div>

  <div class="scrollable-body">
    <div class="match-list" id="matchList"></div>
  </div>

  <script>
    // Supabase 설정 (필수 유지)
    const SUPABASE_URL = "https://ioqxulvuasjsabcvikug.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ZDDxH_TUePOMfhVZCGY1pw_1mgtfK9G";
    const TABLE_NAME = "bet";
    const CURRENT_ROUND = "135";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 파싱된 데이터
    const matchData = [
      { id: 4202, time: "11.15(일) 14:00", league: "일본 리그컵", home: "FC마치다 젤비아", away: "비셀 고베", type: "승무패", pick: "home", pickLabel: "승", odd: 2.29, combs: [1, 2, 3, 4] },
      { id: 4195, time: "11.15(일) 14:00", league: "일본 J2리그", home: "카탈레 도야마", away: "도쿠시마 보르티스", type: "핸디캡 H -1.0", pick: "home", pickLabel: "승", odd: 2.95, combs: [1, 3, 4] },
      { id: 4194, time: "11.15(일) 14:00", league: "일본 J2리그", home: "카탈레 도야마", away: "도쿠시마 보르티스", type: "승무패", pick: "home", pickLabel: "승", odd: 1.67, combs: [2] },
      { id: 4215, time: "11.15(일) 15:00", league: "일본 리그컵", home: "가시마 앤틀러스", away: "요코하마 F마리노스", type: "승무패", pick: "home", pickLabel: "승", odd: 1.73, combs: [1, 2, 4] },
      { id: 4242, time: "11.15(일) 17:00", league: "일본 리그컵", home: "가시와 레이솔", away: "가와사키 프론탈레", type: "승무패", pick: "home", pickLabel: "승", odd: 1.82, combs: [1] },
      { id: 4243, time: "11.15(일) 17:00", league: "일본 리그컵", home: "가시와 레이솔", away: "가와사키 프론탈레", type: "핸디캡 H -1.0", pick: "home", pickLabel: "승", odd: 3.15, combs: [2, 4] },
      { id: 4199, time: "11.15(일) 14:00", league: "일본 J2리그", home: "FC이마바리", away: "주빌로 이와타", type: "핸디캡 H +1.0", pick: "draw", pickLabel: "무", odd: 3.25, combs: [3] },
      { id: 4264, time: "11.16(월) 02:00", league: "UEFA 네이션스리그", home: "벨라루스", away: "알바니아", type: "승무패", pick: "away", pickLabel: "패", odd: 1.86, combs: [3] }
    ];

    const combos = [
      { id: 1, odd: 21.3, bet: 20000, payout: 426000, name: "조합 1" },
      { id: 2, odd: 20.9, bet: 20000, payout: 418000, name: "조합 2" },
      { id: 3, odd: 40.9, bet: 15000, payout: 613500, name: "조합 3" },
      { id: 4, odd: 36.9, bet: 15000, payout: 553500, name: "조합 4" }
    ];

    let matchResults = {}; // { matchId: 'hit' | 'fail' | 'wait' }

    // 유틸
    const formatMoney = (val) => val.toLocaleString() + "원";

    // 렌더링 함수
    function renderApp() {
      renderCards();
      renderMatchList();
    }

    function getComboStatus(comboId) {
      const cMatches = matchData.filter(m => m.combs.includes(comboId));
      const total = cMatches.length;
      let hitCount = 0;
      let failCount = 0;

      cMatches.forEach(m => {
        if (matchResults[m.id] === 'hit') hitCount++;
        else if (matchResults[m.id] === 'fail') failCount++;
      });

      const waitCount = total - hitCount - failCount;
      const isFail = failCount > 0;
      const isHit = hitCount === total;
      const isMatchPoint = waitCount === 1 && !isFail;
      const percent = (hitCount / total) * 100;

      return { total, hitCount, waitCount, failCount, isFail, isHit, isMatchPoint, percent, cMatches };
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      combos.forEach(c => {
        const s = getComboStatus(c.id);
        
        let cardClass = 'combo-card';
        if (s.isHit) cardClass += ' hit';
        if (s.isFail) cardClass += ' fail';

        let mpHtml = '';
        if (s.isMatchPoint) {
          mpHtml = `<div class="match-point-pulse">★막폴 대기중</div>`;
        } else if (s.isHit) {
          mpHtml = `<div style="color: var(--accent-green); font-size: 0.8rem; font-weight:bold; margin-top: 4px;">적중!</div>`;
        } else if (s.isFail) {
          mpHtml = `<div style="color: var(--accent-red); font-size: 0.8rem; margin-top: 4px;">낙첨</div>`;
        }

        const div = document.createElement('div');
        div.className = cardClass;
        div.onclick = () => openDrawer(c.id);
        
        div.innerHTML = `
          <div class="card-fill-gauge" style="width: ${s.isFail ? 0 : s.percent}%"></div>
          <div class="combo-content">
            <div class="combo-title">
              <span>${c.name}</span>
              <span>${s.hitCount}/${s.total}</span>
            </div>
            <div class="combo-stats">
              <span>배당: ${c.odd.toFixed(1)}배</span>
              <span class="highlight">예상: ${formatMoney(c.payout)}</span>
            </div>
            ${mpHtml}
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function renderMatchList() {
      const list = document.getElementById('matchList');
      list.innerHTML = '';

      matchData.forEach(m => {
        const res = matchResults[m.id] || 'wait';
        let statusClass = '';
        let statusText = '';
        if(res === 'hit') { statusClass = 'hit'; statusText = '<span class="status-badge status-hit">적중</span>'; }
        if(res === 'fail') { statusClass = 'fail'; statusText = '<span class="status-badge status-fail">미적중</span>'; }

        const div = document.createElement('div');
        div.className = `match-item ${statusClass}`;
        
        div.innerHTML = `
          <div class="match-header">
            <span>${m.time} | ${m.league}</span>
            <span>No.${m.id} ${statusText}</span>
          </div>
          <div class="match-teams">${m.home} vs ${m.away}</div>
          <div class="match-pick">
            <span>${m.type}</span>
            <span class="pick-val">${m.pickLabel} (${m.odd})</span>
          </div>
          <div class="match-tags">
            ${m.combs.map(c => `<span class="tag">조합 ${c}</span>`).join('')}
          </div>
        `;
        list.appendChild(div);
      });
    }

    // 서랍 로직
    function openDrawer(comboId) {
      const c = combos.find(x => x.id === comboId);
      const s = getComboStatus(comboId);
      
      document.getElementById('drawerTitle').innerText = c.name;
      document.getElementById('drawerBetAmount').innerText = formatMoney(c.bet);
      document.getElementById('drawerPayout').innerText = formatMoney(c.payout);

      const badge = document.getElementById('drawerBadge');
      badge.style.display = 'inline-block';
      badge.className = 'drawer-badge';
      if(s.isHit) {
        badge.innerText = '적중';
      } else if (s.isFail) {
        badge.innerText = '낙첨';
        badge.classList.add('fail-badge');
      } else {
        badge.innerText = `${s.hitCount}/${s.total} 진행중`;
        badge.style.background = 'rgba(255,255,255,0.2)';
        badge.style.color = '#fff';
      }

      const dList = document.getElementById('drawerMatchList');
      dList.innerHTML = '';
      
      s.cMatches.forEach(m => {
        const res = matchResults[m.id] || 'wait';
        let statusClass = '';
        let statusText = '<span class="status-badge status-wait">대기</span>';
        if(res === 'hit') { statusClass = 'hit'; statusText = '<span class="status-badge status-hit">적중</span>'; }
        if(res === 'fail') { statusClass = 'fail'; statusText = '<span class="status-badge status-fail">미적중</span>'; }

        const div = document.createElement('div');
        div.className = `match-item ${statusClass}`;
        div.innerHTML = `
          <div class="match-header">
            <span>${m.time} | ${m.league}</span>
            <span>${statusText}</span>
          </div>
          <div class="match-teams" style="font-size:0.9rem;">${m.home} vs ${m.away}</div>
          <div class="match-pick">
            <span>${m.type}</span>
            <span class="pick-val">${m.pickLabel} (${m.odd})</span>
          </div>
        `;
        dList.appendChild(div);
      });

      document.getElementById('comboDetailDrawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('comboDetailDrawer').classList.remove('open');
    }

    // Supabase 실시간 동기화
    async function fetchResults() {
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');
      try {
        const { data, error } = await supabase
          .from(TABLE_NAME)
          .select('match_id, result')
          .eq('round', CURRENT_ROUND);

        if (error) throw error;

        matchResults = {};
        data.forEach(row => {
          matchResults[row.match_id] = row.result;
        });

        syncDot.classList.add('active');
        syncText.innerText = '동기화됨';
        renderApp();
        
      } catch (err) {
        console.error('Fetch error:', err);
        syncDot.classList.remove('active');
        syncText.innerText = '연결 오류';
      }
    }

    function subscribeRealtime() {
      supabase
        .channel('public:bet')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME, filter: `round=eq.${CURRENT_ROUND}` }, payload => {
          fetchResults();
          // 변경 발생시 시각적 피드백
          const syncDot = document.getElementById('syncDot');
          syncDot.style.transform = 'scale(1.5)';
          setTimeout(() => syncDot.style.transform = 'scale(1)', 300);
        })
        .subscribe();
    }

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      fetchResults();
      subscribeRealtime();
      
      // 혹시라도 데이터를 못가져왔을때를 대비해 기본 렌더링 한번 실행
      renderApp();
    });
  </script>
</body>
</html>
