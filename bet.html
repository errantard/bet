<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로토 승부식 134회차 분석</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-sub); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--warning); display: inline-block; transition: background-color 0.3s; }
    .sync-dot.connected { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .card-fill-gauge { position: absolute; bottom: 0; left: 0; width: 100%; background-color: rgba(34, 197, 94, 0.2); transition: height 0.4s ease; z-index: 1; pointer-events: none; }
    .card-top, .card-mid { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
    .card-top { margin-bottom: 8px; font-size: 0.85rem; }
    .card-title { font-weight: 600; }
    .card-status { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
    .card-odds { font-size: 1.1rem; font-weight: 700; color: var(--warning); }
    .card-progress { font-size: 0.85rem; color: var(--text-sub); }
    
    .card.hit { border-color: var(--success); box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
    .card.dead { border-color: var(--danger); opacity: 0.5; text-decoration: line-through; }

    .combo-drawer { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 20px; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .drawer-title { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: bold; }
    .drawer-badge { font-size: 0.75rem; background: var(--success); color: white; padding: 2px 8px; border-radius: 10px; }
    .drawer-close { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }
    
    .drawer-money-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-size: 0.9rem; }
    .money-item { display: flex; flex-direction: column; gap: 4px; }
    .money-lbl { color: var(--text-sub); font-size: 0.75rem; }
    .money-val { font-weight: bold; }
    .money-item.highlight .money-val { color: var(--warning); }

    .drawer-match-list { display: flex; flex-direction: column; gap: 8px; }
    .drawer-match-item { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .drawer-match-item.hit { border-color: var(--success); background: rgba(34,197,94,0.05); }
    .drawer-match-item.dead { border-color: var(--danger); background: rgba(239,68,68,0.05); }

    .scrollable-body { margin-top: 10px; }
    .match-list { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .match-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub); }
    .match-teams { font-weight: 600; font-size: 0.95rem; }
    .match-picks { display: flex; gap: 6px; }
    .pick-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); }
    .pick-badge.selected { background: var(--primary); border-color: var(--primary); color: white; font-weight: bold; }
    
    .match-point { animation: pulseGlow 1.5s infinite; border-color: var(--warning) !important; }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>프로토 승부식 134회차</h1>
    <div class="sync-status">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">연결 중...</span>
    </div>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <!-- 조합 카드 동적 생성 -->
  </div>

  <div id="comboDetailDrawer" class="combo-drawer" style="display: none;">
    <div class="drawer-header">
      <div class="drawer-title">
        <span id="drawerTitle">조합 1</span>
        <span class="drawer-badge" id="drawerBadge">진행중</span>
      </div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-money-box">
      <div class="money-item">
        <span class="money-lbl">배팅 금액</span>
        <span class="money-val" id="drawerBetAmount">20,000원</span>
      </div>
      <div class="money-item highlight" id="drawerPayoutBox">
        <span class="money-lbl" id="drawerPayoutLbl">예상 당첨금</span>
        <span class="money-val" id="drawerPayout">196,000원</span>
      </div>
    </div>
    <div class="drawer-match-list" id="drawerMatchList"></div>
  </div>

  <div class="scrollable-body">
    <div class="match-list" id="matchList"></div>
  </div>

  <script>
    const CURRENT_ROUND = 134;
    const SUPABASE_URL = "https://ioqxulvuasjsabcvikug.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ZDDxH_TUePOMfhVZCGY1pw_1mgtfK9G";
    
    let supabaseClient = null;
    let activeDrawerCombo = null;

    // 134회차 영수증 기반 데이터 정의
    const combinations = {
      1: { odds: 9.8, bet: 20000, payout: 196000, matches: [3718, 3847, 3861, 3829] },
      2: { odds: 20.2, bet: 20000, payout: 404000, matches: [3718, 3847, 3862, 3829] },
      3: { odds: 22.0, bet: 20000, payout: 440000, matches: [3862, 3829, 3831] }
    };

    const matches = [
      {
        id: 3718,
        date: "11.11 (수) 19:00",
        league: "일본 리그컵",
        teams: "가와사키 프론탈레 vs 가시와 레이솔",
        type: "축구 언더오버 U/O 3.5",
        picks: { home: "오버", away: "언더" },
        myPick: "away", // 언더
        odds: 1.53,
        combs: [1, 2],
        status: "pending" // hit, dead, pending
      },
      {
        id: 3847,
        date: "11.13 (금) 04:45",
        league: "UEFA 네이션스리그",
        teams: "알바니아 vs 핀란드",
        type: "축구 승무패",
        picks: { home: "승", draw: "무", away: "패" },
        myPick: "home", // 승
        odds: 1.80,
        combs: [1, 2],
        status: "pending"
      },
      {
        id: 3861,
        date: "11.13 (금) 04:45",
        league: "UEFA 네이션스리그",
        teams: "이탈리아 vs 프랑스",
        type: "축구 승무패",
        picks: { home: "승", draw: "무", away: "패" },
        myPick: "away", // 패
        odds: 1.64,
        combs: [1],
        status: "pending"
      },
      {
        id: 3862,
        date: "11.13 (금) 04:45",
        league: "UEFA 네이션스리그",
        teams: "이탈리아 vs 프랑스",
        type: "축구 핸디캡 H +1.0",
        picks: { home: "승", draw: "무", away: "패" },
        myPick: "draw", // 무
        odds: 3.40,
        combs: [2, 3],
        status: "pending"
      },
      {
        id: 3829,
        date: "11.13 (금) 23:10",
        league: "남자축구 국제친선경기",
        teams: "아랍에미리트 vs 온두라스",
        type: "축구 승무패",
        picks: { home: "승", draw: "무", away: "패" },
        myPick: "home", // 승
        odds: 2.15,
        combs: [1, 2, 3],
        status: "pending"
      },
      {
        id: 3831,
        date: "11.13 (금) 23:45",
        league: "남자축구 국제친선경기",
        teams: "카타르 vs 호주",
        type: "축구 승무패",
        picks: { home: "승", draw: "무", away: "패" },
        myPick: "home", // 승
        odds: 3.00,
        combs: [3],
        status: "pending"
      }
    ];

    function initApp() {
      renderCards();
      renderMatches();
      initSupabase();
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      
      Object.keys(combinations).forEach(cId => {
        const combo = combinations[cId];
        const totalMatches = combo.matches.length;
        const comboMatches = matches.filter(m => combo.matches.includes(m.id));
        const hitCount = comboMatches.filter(m => m.status === 'hit').length;
        const isDead = comboMatches.some(m => m.status === 'dead');
        const isHit = hitCount === totalMatches;
        
        let statusText = "진행중";
        let cardClass = "";
        if (isHit) { statusText = "적중!"; cardClass = "hit"; }
        else if (isDead) { statusText = "미적중"; cardClass = "dead"; }
        
        const gaugeHeight = (hitCount / totalMatches) * 100;

        const card = document.createElement('div');
        card.className = `card c${cId} ${cardClass}`;
        card.id = `card-${cId}`;
        card.onclick = () => toggleComboDrawer(cId);
        card.innerHTML = `
          <div class="card-fill-gauge" id="gauge-${cId}" style="height: ${gaugeHeight}%"></div>
          <div class="card-top">
            <span class="card-title">조합 ${cId}</span>
            <span class="card-status" id="st-${cId}">${statusText}</span>
          </div>
          <div class="card-mid">
            <span class="card-odds">${combo.odds.toFixed(1)}배</span>
            <span class="card-progress" id="prog-${cId}">${hitCount}/${totalMatches}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderMatches() {
      const list = document.getElementById('matchList');
      list.innerHTML = '';

      matches.forEach(m => {
        const isLastOnePending = m.status === 'pending'; // 간소화된 막폴 판정 예시
        const matchCard = document.createElement('div');
        matchCard.className = `match-card ${isLastOnePending && m.id === 3831 ? 'match-point' : ''}`;
        
        let picksHtml = '';
        Object.keys(m.picks).forEach(key => {
          const isSelected = m.myPick === key;
          picksHtml += `<span class="pick-badge ${isSelected ? 'selected' : ''}">${m.picks[key]} (${m.odds})</span>`;
        });

        matchCard.innerHTML = `
          <div class="match-info">
            <span>${m.date} | ${m.league}</span>
            <span>ID: ${m.id}</span>
          </div>
          <div class="match-teams">${m.teams} (${m.type})</div>
          <div class="match-picks">${picksHtml}</div>
        `;
        list.appendChild(matchCard);
      });
    }

    function toggleComboDrawer(cId) {
      activeDrawerCombo = cId;
      const drawer = document.getElementById('comboDetailDrawer');
      drawer.style.display = 'block';
      
      const combo = combinations[cId];
      document.getElementById('drawerTitle').innerText = `조합 ${cId}`;
      document.getElementById('drawerBetAmount').innerText = combo.bet.toLocaleString() + '원';
      document.getElementById('drawerPayout').innerText = combo.payout.toLocaleString() + '원';
      
      const comboMatches = matches.filter(m => combo.matches.includes(m.id));
      const matchListEl = document.getElementById('drawerMatchList');
      matchListEl.innerHTML = '';
      
      comboMatches.forEach(m => {
        const item = document.createElement('div');
        item.className = `drawer-match-item ${m.status}`;
        item.innerHTML = `
          <div>
            <div style="font-weight:600;">${m.teams}</div>
            <div style="font-size:0.75rem; color:var(--text-sub);">${m.type} / 픽: ${m.picks[m.myPick]}</div>
          </div>
          <div>배당 ${m.odds}</div>
        `;
        matchListEl.appendChild(item);
      });
    }

    function closeDrawer() {
      document.getElementById('comboDetailDrawer').style.display = 'none';
      activeDrawerCombo = null;
    }

    async function initSupabase() {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await supabaseClient
          .from(TABLE_NAME || 'bet')
          .select('*')
          .eq('round', CURRENT_ROUND);

        if(!error) {
          document.getElementById('syncDot').classList.add('connected');
          document.getElementById('syncText').innerText = '실시간 동기화 중';
        } else {
          document.getElementById('syncText').innerText = '오프라인 모드';
        }

        // Realtime 구독 설정
        supabaseClient
          .channel('public:bet')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'bet' }, payload => {
            console.log('Realtime update:', payload);
            // 필요한 경우 데이터 갱신 로직 추가 가능
          })
          .subscribe();
      } catch (e) {
        document.getElementById('syncText').innerText = '연결 실패';
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
